apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitflow-frontend
  namespace: fitflow
  labels:
    app: fitflow-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitflow-frontend
  template:
    metadata:
      labels:
        app: fitflow-frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: fitflow-frontend
          image: mattair39/fitflow-frontend:v1
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          ports:
            - containerPort: 8080
